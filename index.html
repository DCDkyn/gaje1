<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIMAL MOTION STUDY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1920 x 1080 기준 포스터 무대 (script.js가 브라우저 크기에 맞춰 축소/확대) -->
  <main class="stage" id="stage">

    <!-- 상단 정보 -->
    <p class="top-left">INTERACTIVE WEB EXPERIMENT / 2026</p>
    <p class="top-right">ORGANIZED BY MYONGJI UNIVERSITY</p>

    <!-- 메인 그래픽: 원 3개 (가로 배열) -->
    <section class="graphic" aria-label="Motion graphic: three circles">
      <!-- .circle-move : 클릭 인터랙션(위치 이동) 담당 -->
      <!-- .circle      : 기본 애니메이션(수축/팽창 + 부유 + 이동) 담당 -->
      <div class="circle-move" role="button" tabindex="0" aria-label="Circle 1">
        <div class="circle"></div>
      </div>
      <div class="circle-move" role="button" tabindex="0" aria-label="Circle 2">
        <div class="circle"></div>
      </div>
      <div class="circle-move" role="button" tabindex="0" aria-label="Circle 3">
        <div class="circle"></div>
      </div>
    </section>

    <!-- 제목 영역 -->
    <section class="title-block">
      <h1>ANIMAL MOTION STUDY</h1>
      <h2>An Exploration of Movement</h2>
      <p class="description">
        Exploring the rhythm, direction, and behavior of natural movement through geometric forms.
      </p>
    </section>

    <!-- 행사 정보 -->
    <section class="info-block">
      <p><span>DATE</span>DEC 10, 2026</p>
      <p><span>TIME</span>10:00 AM – 06:00 PM</p>
      <p><span>PLACE</span>DIGITAL ART EXHIBITION</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
